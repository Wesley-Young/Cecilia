appId: io.github.wesley-young.cecilia
productName: Cecilia
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  electronLanguages: [en, zh_CN]
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [arm64]
  identity: "-"
  hardenedRuntime: false
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  category: Network
  target: [AppImage]
